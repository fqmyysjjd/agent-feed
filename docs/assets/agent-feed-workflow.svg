<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 980" width="760" height="980" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', sans-serif">
  <defs>
    <!-- Backgrounds -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0d14"/>
      <stop offset="100%" stop-color="#0d0b1a"/>
    </linearGradient>

    <!-- Card fills -->
    <linearGradient id="g-violet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e1040"/>
      <stop offset="100%" stop-color="#120d22"/>
    </linearGradient>
    <linearGradient id="g-blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0c1f3d"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="g-amber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2a1800"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="g-red" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2a0a0a"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="g-green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#042010"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>

    <!-- Glow filters -->
    <filter id="f-violet" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="f-blue" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="f-amber" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="f-red" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="f-green" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- Arrow markers -->
    <marker id="arr-v" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto">
      <path d="M0,0 L0,7 L7,3.5 z" fill="#7c3aed" opacity="0.85"/>
    </marker>
    <marker id="arr-b" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto">
      <path d="M0,0 L0,7 L7,3.5 z" fill="#2563eb" opacity="0.85"/>
    </marker>
    <marker id="arr-a" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto">
      <path d="M0,0 L0,7 L7,3.5 z" fill="#f59e0b" opacity="0.85"/>
    </marker>
    <marker id="arr-r" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto">
      <path d="M0,0 L0,7 L7,3.5 z" fill="#ef4444" opacity="0.85"/>
    </marker>
    <marker id="arr-g" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto">
      <path d="M0,0 L0,7 L7,3.5 z" fill="#059669" opacity="0.85"/>
    </marker>

    <!-- Dot grid pattern -->
    <pattern id="dots" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.8" fill="#ffffff" opacity="0.06"/>
    </pattern>
  </defs>

  <!-- ── Canvas ── -->
  <rect width="760" height="980" fill="url(#bg)" rx="14"/>
  <rect width="760" height="980" fill="url(#dots)" rx="14"/>
  <rect x="1" y="1" width="758" height="978" fill="none" stroke="#7c3aed" stroke-width="0.6" rx="13" opacity="0.25"/>

  <!-- ══ TITLE ══ -->
  <text x="380" y="36" text-anchor="middle" font-family="'SF Mono','Fira Code',monospace" font-size="11" fill="#4b5563" letter-spacing="3" font-weight="500">AGENT FEED · WORKFLOW PIPELINE</text>
  <line x1="100" y1="42" x2="248" y2="42" stroke="#1f2937" stroke-width="0.8"/>
  <line x1="512" y1="42" x2="660" y2="42" stroke="#1f2937" stroke-width="0.8"/>

  <!-- ══════════════════════════════════════
       VERTICAL SPINE  (connector lines)
  ══════════════════════════════════════ -->

  <!-- 1 → 2 -->
  <line x1="380" y1="132" x2="380" y2="172" stroke="#7c3aed" stroke-width="1.4" stroke-dasharray="5,3" marker-end="url(#arr-v)" opacity="0.6"/>

  <!-- 2 → 3 -->
  <line x1="380" y1="232" x2="380" y2="272" stroke="#2563eb" stroke-width="1.4" stroke-dasharray="5,3" marker-end="url(#arr-b)" opacity="0.55"/>

  <!-- 3 → 4 -->
  <line x1="380" y1="332" x2="380" y2="372" stroke="#2563eb" stroke-width="1.4" stroke-dasharray="5,3" marker-end="url(#arr-b)" opacity="0.55"/>

  <!-- 4 → 5 -->
  <line x1="380" y1="432" x2="380" y2="478" stroke="#2563eb" stroke-width="1.4" stroke-dasharray="5,3" marker-end="url(#arr-b)" opacity="0.55"/>

  <!-- 5 Diamond → No → 6 (right/down) -->
  <line x1="380" y1="554" x2="380" y2="592" stroke="#f59e0b" stroke-width="1.4" stroke-dasharray="5,3" marker-end="url(#arr-a)" opacity="0.6"/>
  <text x="388" y="578" font-family="'SF Mono','Fira Code',monospace" font-size="10" fill="#6b7280">No</text>

  <!-- 5 Diamond → Yes → left branch Decision Gate -->
  <path d="M 270,516 C 130,516 130,660 192,660" stroke="#ef4444" stroke-width="1.4" stroke-dasharray="5,3" fill="none" marker-end="url(#arr-r)" opacity="0.65"/>
  <text x="124" y="510" font-family="'SF Mono','Fira Code',monospace" font-size="10" fill="#ef4444">Yes</text>

  <!-- Decision Gate → re-enters Scoped Work -->
  <path d="M 340,688 C 400,720 460,700 460,652" stroke="#ef4444" stroke-width="1.2" stroke-dasharray="4,3" fill="none" marker-end="url(#arr-r)" opacity="0.4"/>

  <!-- 6 → 7 -->
  <line x1="380" y1="712" x2="380" y2="752" stroke="#059669" stroke-width="1.4" stroke-dasharray="5,3" marker-end="url(#arr-g)" opacity="0.65"/>

  <!-- 7 → 8 -->
  <line x1="380" y1="812" x2="380" y2="852" stroke="#059669" stroke-width="1.4" stroke-dasharray="5,3" marker-end="url(#arr-g)" opacity="0.65"/>

  <!-- ══════════════════════════════════════
       NODE 1 — AGENTS.md  (violet hexagon-ish)
       y: 60–132
  ══════════════════════════════════════ -->
  <g filter="url(#f-violet)">
    <rect x="160" y="60" width="440" height="72" rx="11" fill="url(#g-violet)" stroke="#7c3aed" stroke-width="1.8"/>
  </g>
  <!-- top accent bar -->
  <rect x="160" y="60" width="440" height="3" rx="1.5" fill="#7c3aed" opacity="0.9"/>
  <!-- step number -->
  <text x="180" y="103" font-family="'SF Mono','Fira Code',monospace" font-size="10" fill="#6d28d9" opacity="0.7">01</text>
  <!-- icon -->
  <text x="204" y="106" font-size="24" dominant-baseline="middle" dy="-2">📋</text>
  <!-- label -->
  <text x="242" y="93" font-size="16" font-weight="700" fill="#c4b5fd" letter-spacing="0.3">AGENTS.md</text>
  <text x="242" y="113" font-family="'SF Mono','Fira Code',monospace" font-size="11" fill="#8b5cf6" opacity="0.8">Entry Contract · Priority Order · Mandatory Gates · Routing</text>

  <!-- ══════════════════════════════════════
       NODE 2 — Outcome Boundary
       y: 172–232
  ══════════════════════════════════════ -->
  <g filter="url(#f-blue)">
    <rect x="160" y="172" width="440" height="60" rx="10" fill="url(#g-blue)" stroke="#2563eb" stroke-width="1.4"/>
  </g>
  <text x="180" y="207" font-family="'SF Mono','Fira Code',monospace" font-size="10" fill="#1d4ed8" opacity="0.7">02</text>
  <text x="204" y="207" font-size="20">🎯</text>
  <text x="236" y="198" font-size="14" font-weight="700" fill="#93c5fd">Outcome Boundary &amp; Task Brief</text>
  <text x="236" y="218" font-family="'SF Mono','Fira Code',monospace" font-size="10.5" fill="#60a5fa" opacity="0.75">Scope lock · reject unsolicited redesigns</text>

  <!-- ══════════════════════════════════════
       NODE 3 — Context Loading
       y: 272–332
  ══════════════════════════════════════ -->
  <g filter="url(#f-blue)">
    <rect x="160" y="272" width="440" height="60" rx="10" fill="url(#g-blue)" stroke="#2563eb" stroke-width="1.4"/>
  </g>
  <text x="180" y="307" font-family="'SF Mono','Fira Code',monospace" font-size="10" fill="#1d4ed8" opacity="0.7">03</text>
  <text x="204" y="307" font-size="20">🧠</text>
  <text x="236" y="298" font-size="14" font-weight="700" fill="#93c5fd">Task Classification &amp; Context Loading</text>
  <text x="236" y="318" font-family="'SF Mono','Fira Code',monospace" font-size="10.5" fill="#60a5fa" opacity="0.75">Rules · project constraints · domain docs · skills</text>

  <!-- ══════════════════════════════════════
       NODE 4 — Skill Routing
       y: 372–432
  ══════════════════════════════════════ -->
  <g filter="url(#f-blue)">
    <rect x="160" y="372" width="440" height="60" rx="10" fill="url(#g-blue)" stroke="#2563eb" stroke-width="1.4"/>
  </g>
  <text x="180" y="407" font-family="'SF Mono','Fira Code',monospace" font-size="10" fill="#1d4ed8" opacity="0.7">04</text>
  <text x="204" y="407" font-size="20">⚡</text>
  <text x="236" y="398" font-size="14" font-weight="700" fill="#93c5fd">Skill Routing</text>
  <text x="236" y="418" font-family="'SF Mono','Fira Code',monospace" font-size="10.5" fill="#60a5fa" opacity="0.75">.agents/skills/ · project/domain source-of-truth lookup</text>

  <!-- ══════════════════════════════════════
       NODE 5 — Decision Diamond
       center: (380, 516)  half-w:110  half-h:38
  ══════════════════════════════════════ -->
  <g filter="url(#f-amber)">
    <polygon points="380,478  490,516  380,554  270,516" fill="url(#g-amber)" stroke="#f59e0b" stroke-width="1.8"/>
  </g>
  <text x="180" y="512" font-family="'SF Mono','Fira Code',monospace" font-size="10" fill="#92400e" opacity="0.7">05</text>
  <text x="380" y="510" text-anchor="middle" font-size="13" font-weight="700" fill="#fcd34d">Affects Future</text>
  <text x="380" y="527" text-anchor="middle" font-size="13" font-weight="700" fill="#fcd34d">Behavior?</text>

  <!-- ══════════════════════════════════════
       NODE 6L — Decision Gate (left branch)
       y: 624–696
  ══════════════════════════════════════ -->
  <g filter="url(#f-red)">
    <rect x="46" y="624" width="196" height="72" rx="10" fill="url(#g-red)" stroke="#ef4444" stroke-width="1.4"/>
  </g>
  <rect x="46" y="624" width="196" height="3" rx="1.5" fill="#ef4444" opacity="0.8"/>
  <text x="66" y="659" font-family="'SF Mono','Fira Code',monospace" font-size="10" fill="#991b1b" opacity="0.7">06a</text>
  <text x="88" y="659" font-size="18">🚦</text>
  <text x="116" y="656" font-size="13" font-weight="700" fill="#fca5a5">Decision Gate</text>
  <text x="116" y="674" font-family="'SF Mono','Fira Code',monospace" font-size="10.5" fill="#f87171" opacity="0.85">Ask Human ↩</text>
  <text x="66" y="690" font-family="'SF Mono','Fira Code',monospace" font-size="9.5" fill="#7f1d1d" opacity="0.6">arch · contracts · verification</text>

  <!-- ══════════════════════════════════════
       NODE 6 — Scoped Work & Verification (main)
       y: 592–712
  ══════════════════════════════════════ -->
  <g filter="url(#f-blue)">
    <rect x="276" y="592" width="424" height="72" rx="10" fill="url(#g-blue)" stroke="#2563eb" stroke-width="1.4"/>
  </g>
  <text x="296" y="633" font-family="'SF Mono','Fira Code',monospace" font-size="10" fill="#1d4ed8" opacity="0.7">06</text>
  <text x="318" y="633" font-size="20">🔬</text>
  <text x="350" y="624" font-size="14" font-weight="700" fill="#93c5fd">Scoped Work &amp; Verification</text>
  <text x="350" y="644" font-family="'SF Mono','Fira Code',monospace" font-size="10.5" fill="#60a5fa" opacity="0.75">Tests · doc checks · outcome boundary gates</text>
  <text x="350" y="658" font-family="'SF Mono','Fira Code',monospace" font-size="9.5" fill="#3b82f6" opacity="0.5">← Decision gate rejoins here after human confirm</text>

  <!-- ══════════════════════════════════════
       NODE 7 — Review Gate
       y: 752–812
  ══════════════════════════════════════ -->
  <g filter="url(#f-green)">
    <rect x="160" y="752" width="440" height="60" rx="10" fill="url(#g-green)" stroke="#059669" stroke-width="1.6"/>
  </g>
  <rect x="160" y="752" width="440" height="3" rx="1.5" fill="#059669" opacity="0.85"/>
  <text x="180" y="787" font-family="'SF Mono','Fira Code',monospace" font-size="10" fill="#065f46" opacity="0.7">07</text>
  <text x="204" y="787" font-size="20">🔍</text>
  <text x="236" y="778" font-size="14" font-weight="700" fill="#6ee7b7">Review Gate</text>
  <text x="236" y="798" font-family="'SF Mono','Fira Code',monospace" font-size="10.5" fill="#34d399" opacity="0.8">Human-approved · evidence-backed "done"</text>

  <!-- ══════════════════════════════════════
       NODE 8 — Clean Handoff (pill)
       y: 852–912
  ══════════════════════════════════════ -->
  <g filter="url(#f-green)">
    <rect x="110" y="852" width="540" height="56" rx="28" fill="url(#g-green)" stroke="#059669" stroke-width="2"/>
  </g>
  <!-- pulse rings -->
  <circle cx="148" cy="880" r="8" fill="#059669" opacity="0.85"/>
  <circle cx="148" cy="880" r="14" fill="none" stroke="#059669" stroke-width="1" opacity="0.35"/>
  <circle cx="148" cy="880" r="20" fill="none" stroke="#059669" stroke-width="0.5" opacity="0.15"/>
  <circle cx="612" cy="880" r="8" fill="#059669" opacity="0.85"/>
  <circle cx="612" cy="880" r="14" fill="none" stroke="#059669" stroke-width="1" opacity="0.35"/>
  <circle cx="612" cy="880" r="20" fill="none" stroke="#059669" stroke-width="0.5" opacity="0.15"/>
  <text x="380" y="874" text-anchor="middle" font-size="14" font-weight="700" fill="#6ee7b7">✦  Clean Handoff</text>
  <text x="380" y="893" text-anchor="middle" font-family="'SF Mono','Fira Code',monospace" font-size="11" fill="#34d399" opacity="0.85">Context Capsule · session-state preserved · resumable</text>
  <text x="180" y="787" font-family="'SF Mono','Fira Code',monospace" font-size="10" fill="#065f46" opacity="0">08</text>
  <!-- step 08 label -->
  <text x="380" y="856" text-anchor="middle" font-family="'SF Mono','Fira Code',monospace" font-size="9" fill="#059669" opacity="0.45">08</text>

  <!-- ══════════════════════════════════════
       FLOWING PARTICLES on main spine
  ══════════════════════════════════════ -->
  <circle cx="380" cy="152" r="2.5" fill="#7c3aed" opacity="0.7"/>
  <circle cx="380" cy="252" r="2.5" fill="#2563eb" opacity="0.6"/>
  <circle cx="380" cy="352" r="2.5" fill="#2563eb" opacity="0.6"/>
  <circle cx="380" cy="455" r="2.5" fill="#2563eb" opacity="0.6"/>
  <circle cx="380" cy="572" r="2.5" fill="#f59e0b" opacity="0.7"/>
  <circle cx="380" cy="732" r="2.5" fill="#059669" opacity="0.7"/>
  <circle cx="380" cy="832" r="2.5" fill="#059669" opacity="0.7"/>

  <!-- ══════════════════════════════════════
       LEGEND (bottom)
  ══════════════════════════════════════ -->
  <g transform="translate(160, 930)">
    <circle cx="8" cy="7" r="5" fill="#7c3aed" opacity="0.8"/>
    <text x="18" y="11" font-family="'SF Mono','Fira Code',monospace" font-size="9.5" fill="#6b7280">Entry</text>
    <circle cx="78" cy="7" r="5" fill="#2563eb" opacity="0.8"/>
    <text x="88" y="11" font-family="'SF Mono','Fira Code',monospace" font-size="9.5" fill="#6b7280">Workflow</text>
    <circle cx="168" cy="7" r="5" fill="#f59e0b" opacity="0.8"/>
    <text x="178" y="11" font-family="'SF Mono','Fira Code',monospace" font-size="9.5" fill="#6b7280">Decision</text>
    <circle cx="258" cy="7" r="5" fill="#ef4444" opacity="0.8"/>
    <text x="268" y="11" font-family="'SF Mono','Fira Code',monospace" font-size="9.5" fill="#6b7280">Human Gate</text>
    <circle cx="358" cy="7" r="5" fill="#059669" opacity="0.8"/>
    <text x="368" y="11" font-family="'SF Mono','Fira Code',monospace" font-size="9.5" fill="#6b7280">Complete</text>
  </g>
</svg>