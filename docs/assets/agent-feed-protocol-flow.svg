<svg width="1280" height="520" viewBox="0 0 1280 520" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Agent Feed protocol flow</title>
  <desc id="desc">A repository-owned AI development workflow from AGENTS.md entry through context loading, decision gates, verification, review, and handoff.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="520" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0F172A"/>
      <stop offset="0.52" stop-color="#111827"/>
      <stop offset="1" stop-color="#042F2E"/>
    </linearGradient>
    <linearGradient id="accent" x1="118" y1="90" x2="1140" y2="430" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22D3EE"/>
      <stop offset="0.48" stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#34D399"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#FFFFFF" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.06"/>
    </linearGradient>
    <filter id="softShadow" x="-18" y="-18" width="260" height="170" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
  </defs>

  <rect width="1280" height="520" rx="28" fill="url(#bg)"/>
  <path d="M86 384C218 279 331 246 473 282C640 324 739 188 885 142C1001 105 1104 135 1192 207" stroke="url(#accent)" stroke-opacity="0.26" stroke-width="64" stroke-linecap="round"/>
  <path d="M95 386C226 281 334 255 471 290C642 333 739 197 888 151C1002 116 1101 144 1182 211" stroke="url(#accent)" stroke-opacity="0.9" stroke-width="3" stroke-linecap="round"/>

  <text x="80" y="74" fill="#F8FAFC" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="34" font-weight="800">Repository-owned AI workflow</text>
  <text x="80" y="108" fill="#CBD5E1" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18">One canonical path from instruction loading to verified handoff.</text>

  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <g filter="url(#softShadow)">
      <rect x="80" y="170" width="190" height="112" rx="18" fill="url(#card)" stroke="#67E8F9" stroke-opacity="0.38"/>
      <circle cx="111" cy="204" r="14" fill="#22D3EE"/>
      <text x="134" y="210" fill="#F8FAFC" font-size="17" font-weight="700">Entry Contract</text>
      <text x="104" y="243" fill="#CBD5E1" font-size="14">AGENTS.md</text>
      <text x="104" y="263" fill="#94A3B8" font-size="13">priority + gates</text>
    </g>

    <path d="M280 226H333" stroke="#94A3B8" stroke-width="2" stroke-linecap="round"/>
    <path d="M326 219L335 226L326 233" stroke="#94A3B8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

    <g filter="url(#softShadow)">
      <rect x="348" y="170" width="190" height="112" rx="18" fill="url(#card)" stroke="#C4B5FD" stroke-opacity="0.42"/>
      <circle cx="379" cy="204" r="14" fill="#A78BFA"/>
      <text x="402" y="210" fill="#F8FAFC" font-size="17" font-weight="700">Task Boundary</text>
      <text x="372" y="243" fill="#CBD5E1" font-size="14">Outcome + Brief</text>
      <text x="372" y="263" fill="#94A3B8" font-size="13">scope before work</text>
    </g>

    <path d="M548 226H601" stroke="#94A3B8" stroke-width="2" stroke-linecap="round"/>
    <path d="M594 219L603 226L594 233" stroke="#94A3B8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

    <g filter="url(#softShadow)">
      <rect x="616" y="170" width="190" height="112" rx="18" fill="url(#card)" stroke="#93C5FD" stroke-opacity="0.38"/>
      <circle cx="647" cy="204" r="14" fill="#60A5FA"/>
      <text x="670" y="210" fill="#F8FAFC" font-size="17" font-weight="700">Context Routing</text>
      <text x="640" y="243" fill="#CBD5E1" font-size="14">rules + project</text>
      <text x="640" y="263" fill="#94A3B8" font-size="13">domain + skills</text>
    </g>

    <path d="M816 226H869" stroke="#94A3B8" stroke-width="2" stroke-linecap="round"/>
    <path d="M862 219L871 226L862 233" stroke="#94A3B8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

    <g filter="url(#softShadow)">
      <rect x="884" y="170" width="190" height="112" rx="18" fill="url(#card)" stroke="#FDE68A" stroke-opacity="0.48"/>
      <circle cx="915" cy="204" r="14" fill="#FBBF24"/>
      <text x="938" y="210" fill="#F8FAFC" font-size="17" font-weight="700">Decision Gate</text>
      <text x="908" y="243" fill="#CBD5E1" font-size="14">stop when future</text>
      <text x="908" y="263" fill="#94A3B8" font-size="13">behavior changes</text>
    </g>

    <path d="M1078 226H1131" stroke="#94A3B8" stroke-width="2" stroke-linecap="round"/>
    <path d="M1124 219L1133 226L1124 233" stroke="#94A3B8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

    <g filter="url(#softShadow)">
      <rect x="1005" y="332" width="190" height="112" rx="18" fill="url(#card)" stroke="#86EFAC" stroke-opacity="0.42"/>
      <circle cx="1036" cy="366" r="14" fill="#34D399"/>
      <text x="1059" y="372" fill="#F8FAFC" font-size="17" font-weight="700">Clean Handoff</text>
      <text x="1029" y="405" fill="#CBD5E1" font-size="14">review + evidence</text>
      <text x="1029" y="425" fill="#94A3B8" font-size="13">Context Capsule</text>
    </g>

    <g filter="url(#softShadow)">
      <rect x="1110" y="170" width="90" height="112" rx="18" fill="#F8FAFC" fill-opacity="0.1" stroke="#86EFAC" stroke-opacity="0.46"/>
      <text x="1134" y="213" fill="#F8FAFC" font-size="24" font-weight="800">✓</text>
      <text x="1132" y="246" fill="#CBD5E1" font-size="14">verified</text>
      <text x="1136" y="266" fill="#94A3B8" font-size="13">done</text>
    </g>

    <path d="M1155 287V319" stroke="#94A3B8" stroke-width="2" stroke-linecap="round"/>
    <path d="M1148 312L1155 321L1162 312" stroke="#94A3B8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

    <g>
      <rect x="82" y="336" width="268" height="68" rx="18" fill="#020617" fill-opacity="0.42" stroke="#334155"/>
      <text x="108" y="365" fill="#F8FAFC" font-size="15" font-weight="700">Why it works</text>
      <text x="108" y="388" fill="#CBD5E1" font-size="14">stable protocol, additive customization</text>
    </g>

    <g>
      <rect x="384" y="336" width="282" height="68" rx="18" fill="#020617" fill-opacity="0.42" stroke="#334155"/>
      <text x="410" y="365" fill="#F8FAFC" font-size="15" font-weight="700">What stays local</text>
      <text x="410" y="388" fill="#CBD5E1" font-size="14">project constraints, domain facts, session state</text>
    </g>
  </g>
</svg>
