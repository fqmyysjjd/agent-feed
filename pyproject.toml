[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "agent-feed"
version = "0.1.2"
description = "CLI for installing AGENTS.md, .agents rules, AI coding workflows, and client adapters into software projects."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
  { name = "Agent Feed Contributors" }
]
dependencies = [
  "InquirerPy>=0.3.4",
  "httpx[socks]>=0.27",
  "rich>=13.9",
  "typer>=0.12",
]
keywords = [
  "agents",
  "agents-md",
  "ai-agents",
  "ai-coding",
  "ai-engineering",
  "ai-development",
  "ai-software-engineering",
  "agentic-development",
  "ai-assisted-development",
  "claude-code",
  "codex",
  "cursor",
  "developer-tools",
  "context-management",
  "verification",
  "code-review",
  "software-quality",
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Topic :: Software Development :: Code Generators",
  "Topic :: Software Development :: Quality Assurance",
]

[project.scripts]
agent-feed = "agent_feed.cli:main"

[dependency-groups]
dev = [
  "mypy>=1.10",
  "pytest>=8.0",
  "ruff>=0.6",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true

[tool.hatch.build.targets.wheel]
packages = ["src/agent_feed"]

[tool.hatch.build.targets.sdist]
only-include = [
  "/LICENSE",
  "/README.md",
  "/pyproject.toml",
  "/src/agent_feed",
]
